name: PR Check - Calidad y Helm Chart

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint y tests de Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install -r backend/requirements-dev.txt

      - name: Flake8
        run: flake8 backend/ --max-line-length=120

      - name: Pytest
        run: pytest backend/tests/ --cov=backend

  helm-validation:
    name: Helm Chart (render first)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.13.0

      - name: Instalar yamllint y kubeconform
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq yamllint
          curl -sSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Render y validación
        run: ./scripts/render-validate.sh

      - name: Validar esquemas de Kubernetes
        run: kubeconform -strict -summary manifests-rendered-prod.yaml

      - name: Publicar manifiestos renderizados
        uses: actions/upload-artifact@v4
        with:
          name: manifiestos-k8s-renderizados
          path: manifests-rendered-prod.yaml
          retention-days: 7
